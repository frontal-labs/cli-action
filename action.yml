name: Frontal CLI
description: Sets up the Frontal CLI for use in GitHub Actions
author: Frontal Labs
branding:
  icon: terminal
  color: blue
runs:
  using: node24
  main: dist/index.js
inputs:
  version:
    description: 'Version of the Frontal CLI to install. Defaults to "latest".'
    default: latest
    required: false
  api-key:
    description: 'Frontal API key (frt_...). Exported as FRONTAL_API_KEY.'
    required: false
  api-url:
    description: 'Frontal API base URL. Defaults to https://api.frontal.dev/v1.'
    required: false
